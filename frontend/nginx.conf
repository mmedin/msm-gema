server {
    listen 80;
    server_name localhost;

    # -----------------------------------------------------------------------
    # Headers de seguridad globales (SEC-07 / UX-05)
    # -----------------------------------------------------------------------
    # CSP estricto: mitiga XSS y protege el JWT almacenado en localStorage.
    # - 'unsafe-inline' y https://fonts.googleapis.com en style-src para Leaflet y Google Fonts.
    # - data:, blob:, *.basemaps.cartocdn.com, *.tile.openstreetmap.org y unpkg.com en img-src para mapas e íconos.
    # - https://fonts.gstatic.com en font-src para tipografías de Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://unpkg.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Raíz de la SPA
    root /usr/share/nginx/html;
    index index.html;

    # 1. Servir archivos estáticos GeoJSON con Content-Type application/json
    location /datos-geo/ {
        alias /usr/share/nginx/html/datos-geo/;
        default_type application/json;
        add_header Content-Type application/json;
        expires 1h;
    }

    # 2. Servir uploads con autoindex estrictamente deshabilitado
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 3. Proxy a la API backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # 4. Fallback para SPA enrutada en cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}


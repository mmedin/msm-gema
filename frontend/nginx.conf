server {
    listen 80;
    server_name localhost;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Raíz de la SPA
    root /usr/share/nginx/html;
    index index.html;

    # 1. Servir archivos estáticos GeoJSON con Content-Type application/json
    location /datos-geo/ {
        alias /usr/share/nginx/html/datos-geo/;
        default_type application/json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
    }

    # 2. Servir uploads con autoindex estrictamente deshabilitado
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin *;
    }

    # 3. Proxy a la API backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # 4. Fallback para SPA enrutada en cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
